<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频播放器 · AIGC 工具箱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M20 14h28v8H20zM20 28h28v8H20zM20 42h18v8H20z' fill='white' opacity='.95'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0e17">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html">
      <span class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
      </span>
      AIGC 工具箱
    </a>
    <span class="spacer"></span>
    <a class="back-link" href="../index.html">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      返回首页
    </a>
  </header>

  <main class="container">
    <div class="video-layout">
      <!-- 左：播放器 -->
      <section>
        <div class="video-stage" id="stage">
          <video id="video" playsinline></video>

          <div class="video-empty" id="video-empty">
            <div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:46px;height:46px;margin-bottom:10px">
                <rect x="2" y="4" width="15" height="16" rx="2"/><path d="m22 8-5 4 5 4V8z"/>
              </svg>
              <div style="font-weight:600">点击选择视频，或将文件拖到这里</div>
              <div class="small" style="margin-top:4px">支持 MP4 / WebM / MOV 等浏览器可播放格式</div>
            </div>
          </div>

          <div class="center-play" id="center-play">
            <button class="icon-btn" title="播放">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>

          <div class="drag-overlay">松开即播放</div>

          <!-- 自定义控制栏 -->
          <div class="v-controls" id="v-controls">
            <div class="v-progress" id="v-progress">
              <div class="buffered" id="v-buffered"></div>
              <div class="played" id="v-played"></div>
              <div class="knob" id="v-knob"></div>
              <div class="hover-time" id="hover-time">0:00</div>
            </div>
            <div class="v-buttons">
              <button class="icon-btn" id="v-play" title="播放/暂停（空格）">
                <svg id="v-icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="v-icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
              </button>
              <button class="icon-btn" id="v-prev" title="上一个">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
              </button>
              <button class="icon-btn" id="v-next" title="下一个">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
              </button>
              <span class="time"><span id="v-cur">0:00</span> / <span id="v-dur">0:00</span></span>
              <span class="gap"></span>

              <span class="v-vol">
                <button class="icon-btn" id="v-mute" title="静音（M）">
                  <svg id="v-vol-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                  </svg>
                  <svg id="v-vol-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/>
                  </svg>
                </button>
                <input type="range" id="v-volume" min="0" max="100" value="100" aria-label="音量">
              </span>

              <select class="v-speed" id="v-speed" title="倍速">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>倍速</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
              </select>

              <button class="icon-btn" id="v-subtitle" title="加载本地字幕（.vtt）">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 12h4M14 12h4M6 16h12"/>
                </svg>
              </button>
              <button class="icon-btn" id="v-snapshot" title="截图保存当前画面（S）">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
                </svg>
              </button>
              <button class="icon-btn" id="v-pip" title="画中画（P）">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="3" width="20" height="16" rx="2"/><rect x="12" y="11" width="8" height="6" rx="1" fill="currentColor"/>
                </svg>
              </button>
              <button class="icon-btn" id="v-full" title="全屏（F）">
                <svg id="v-icon-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
                </svg>
                <svg id="v-icon-full-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="kbd-hint">
          <span><kbd>空格</kbd> 播放/暂停</span>
          <span><kbd>←</kbd> <kbd>→</kbd> 快退/快进 5s</span>
          <span><kbd>↑</kbd> <kbd>↓</kbd> 音量</span>
          <span><kbd>M</kbd> 静音</span>
          <span><kbd>F</kbd> 全屏</span>
          <span><kbd>P</kbd> 画中画</span>
          <span><kbd>S</kbd> 截图</span>
          <span>双击画面 = 全屏</span>
        </div>
      </section>

      <!-- 右：来源 + 播放列表 -->
      <section class="card">
        <div class="dropzone" id="dropzone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5-5 5 5"/><path d="M12 5v13"/>
          </svg>
          <div class="dz-title">点击选择或拖入视频文件</div>
          <div class="dz-sub">可多选，自动加入播放列表</div>
        </div>
        <input type="file" id="file-input" accept="video/*,.mp4,.webm,.mkv,.mov,.m4v" multiple hidden>
        <input type="file" id="subtitle-input" accept=".vtt,text/vtt" hidden>

        <div class="url-bar">
          <input type="text" id="url-input" placeholder="粘贴视频网络链接（https://…）" spellcheck="false">
          <button class="btn btn-primary" id="btn-url">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
            播放链接
          </button>
        </div>

        <button class="btn" id="btn-demo" style="width:100%; margin-top:12px;" title="Big Buck Bunny（CC-BY Blender Foundation）">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          没有视频？点这里播放演示视频
        </button>

        <div style="margin-top:18px; display:flex; align-items:center; justify-content:space-between;">
          <strong style="font-size:14px;">播放列表</strong>
          <button class="btn small" id="btn-clear" style="padding:5px 12px; font-size:12.5px;">清空</button>
        </div>
        <ul class="playlist" id="playlist"></ul>
        <p class="muted small" id="playlist-empty" style="text-align:center; padding:18px 0;">列表为空，先添加一些视频吧</p>
      </section>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="../js/utils.js"></script>
  <script src="../js/video-player.js"></script>
</body>
</html>
