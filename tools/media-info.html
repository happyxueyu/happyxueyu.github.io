<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>媒体信息查看 · AIGC 工具箱</title>
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0e17">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html">
      <span class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
      </span>
      AIGC 工具箱
    </a>
    <span class="spacer"></span>
    <a class="back-link" href="../index.html">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      返回首页
    </a>
  </header>

  <main class="container">
    <section class="card">
      <div class="dropzone" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5-5 5 5"/><path d="M12 5v13"/>
        </svg>
        <div class="dz-title">点击选择或拖入音频 / 视频文件</div>
        <div class="dz-sub">所有解析均在浏览器本地完成，文件不会被上传</div>
      </div>
      <input type="file" id="file-input" accept="audio/*,video/*" hidden>

      <div class="info-empty" id="info-empty">尚未选择文件</div>
      <div class="info-grid" id="info-grid" style="display:none;"></div>
    </section>
  </main>

  <div id="toast-container"></div>
  <script src="../js/utils.js"></script>
  <script src="../js/media-info.js"></script>
</body>
</html>
