<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="精进群工具箱（测试）：定时自动播放指定视频，早 5:30 与晚 20:00 各播放一遍。">
  <title>精进群工具箱测试</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0e17">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <h1 id="site-title">精进群工具箱测试</h1>
    <div id="clock">--:--:--</div>
    <div id="date-line">—</div>

    <!-- 内嵌播放器：待机时显示纯色待机屏（下一场信息），到点在此自动播放 -->
    <div id="player-wrap">
      <video id="video" playsinline webkit-playsinline
             x5-video-player-type="h5" x5-video-player-fullscreen="false"
             preload="auto" disablepictureinpicture></video>

      <!-- 播放器外观栏：进度纯展示；全屏按钮可点 -->
      <div id="vbar">
        <svg id="vb-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="vb-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        <div id="vb-track"><div id="vb-fill"></div></div>
        <span id="vb-time">0:00 / 0:00</span>
        <button id="fs-btn" title="横屏全屏 / 退出全屏">
          <svg id="fs-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          <svg id="fs-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
        </button>
      </div>

      <!-- 静音提示：静音即显示，点击开启 -->
      <button id="unmute-btn" hidden><span class="mute-ic">🔇</span>开声音</button>

      <!-- 缓冲提示：视频加载时显示，避免黑屏无反馈 -->
      <div id="buffering" hidden><span class="dot-flask"><span>●</span><span>●</span><span>●</span></span>视频加载中…</div>

      <div id="player-standby">
        <img src="icons/icon-192.png" alt="" width="88" height="88">
        <div id="sb-label">下一场将播放</div>
        <div id="sb-name">—</div>
        <div id="sb-time">--:--</div>
        <div id="sb-countdown">—</div>
      </div>
      <div id="player-state">待机</div>
      <button id="fs-exit" hidden title="退出全屏">✕</button>
    </div>

    <div class="slots" id="slots"><!-- 由 js/app.js 按 config.json 动态渲染 --></div>

    <div id="countdown">—</div>
    <div class="hint muted" id="wake-hint"></div>
  </main>

  <!-- 刷新按钮 -->
  <button id="refresh-btn" title="刷新页面">⟳</button>

  <footer id="note">注：本视频为测试用途，若有问题可直接反馈至
    <a href="mailto:329665584@qq.com">329665584@qq.com</a>
  </footer>

  <div id="toast-container"></div>
  <script src="js/app.js"></script>
</body>
</html>
